# tuned/devices/gb10.conf — static device config for GB10 (Grace Blackwell,
# DGX Spark, aarch64). See tuned/devices/rtx50.conf for the full explanation
# of GPU_TUNED_VARIANT vs. GPU_TUNED_PLATFORM.
#
# This is the CANONICAL source for the sm_121a-vs-sm_120a explanation below
# -- rtx40.conf/rtx50.conf cross-reference back to this file rather than
# repeating it. Mirrors the same GPU_TUNED_* convention established in
# zbrad/raft's tuned/devices/gb10.conf.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"

# ── Rule: GB10 must target sm_121a, not bare sm_121 ─────────────────────────
# The trailing "a" selects the Blackwell family-specific ("accelerated") ISA
# extensions exposed on Blackwell silicon and absent from the generic
# non-suffixed sm_121 target. GB10 (Grace Blackwell, DGX Spark) needs the "a"
# variant -- so does RTX 50 (consumer Blackwell): both expose this
# accelerated instruction set -- see tuned/devices/rtx50.conf, which also
# targets sm_120a for the same reason.
# Every tuned/*.sh script must derive its CUDA arch from GPU_TUNED_CUDA_ARCH
# rather than hardcoding "121a"/"121" so this can't drift.
GPU_TUNED_CUDA_ARCH="121a"

# BUILD_MG_ALGOS is OFF for GB10 only (single-GPU edge device -- no
# multi-GPU algorithms to build); ON for rtx40/rtx50 (see those confs).
GPU_TUNED_BUILD_MG_ALGOS="OFF"

GPU_TUNED_HW_LABEL="GB10 Grace Blackwell Superchip (DGX Spark)"
GPU_TUNED_DEVICE_LABEL="GB10"
