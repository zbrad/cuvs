# tuned/devices/rtx40.conf — static device config for RTX 40 (Ada Lovelace
# consumer, x86_64). See tuned/devices/gb10.conf for the full sm_121a-vs-
# sm_120a explanation and tuned/devices/rtx50.conf for the
# GPU_TUNED_VARIANT/GPU_TUNED_PLATFORM background.

GPU_TUNED_VARIANT="rtx40"
GPU_TUNED_PLATFORM="x86_64"

# ── Rule: RTX 40 targets bare sm_89, not a family-specific "a" variant ──────
# RTX 40 (Ada Lovelace) is consumer silicon with no family-specific
# ("accelerated") ISA extension exposed on it, unlike Blackwell (see
# tuned/devices/gb10.conf). "89" covers the whole 40-series (4080/4090)
# since none of those SKUs differ in compute capability.
GPU_TUNED_CUDA_ARCH="89"

GPU_TUNED_BUILD_MG_ALGOS="ON"

GPU_TUNED_HW_LABEL="RTX 4080, RTX 4090 (Ada Lovelace)"
GPU_TUNED_DEVICE_LABEL="RTX 40"
