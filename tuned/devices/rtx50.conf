# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, x86_64). See tuned/devices/gb10.conf for the full sm_121a-vs-
# sm_120a explanation.
#
# GPU_TUNED_VARIANT is this build's codename (gb10/rtx40/rtx50) -- used for
# both the output library name (libcuvs-${GPU_TUNED_VARIANT}-${CUDA_TAG}.so)
# and to pick this file. GPU_TUNED_PLATFORM is the CPU arch env.sh checks
# `uname -m` against before building, so a build never silently runs on the
# wrong host.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"

# ── Rule: RTX 50 must target sm_120a, not bare sm_120 ───────────────────────
# Same rationale as GB10's sm_121a (see tuned/devices/gb10.conf) -- RTX 50
# (consumer Blackwell) exposes the same family-specific accelerated tensor-
# core instructions, required for RTX 50-specific performance, absent from
# the generic non-suffixed sm_120 target.
GPU_TUNED_CUDA_ARCH="120a"

GPU_TUNED_BUILD_MG_ALGOS="ON"

GPU_TUNED_HW_LABEL="RTX 50-series (Blackwell consumer, desktop/laptop, SM 120a)"
GPU_TUNED_DEVICE_LABEL="RTX 50"
